name: Source snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fp-dashboard-source
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          retention-days: 1
